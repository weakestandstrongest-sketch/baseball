# 実際のスポーツナビ / NPB.jp のページを保存する (パーサー調整用)
name: capture-pages
on:
  workflow_dispatch:
  push:
    paths:
      - dev/capture.mjs
      - .github/workflows/capture.yml
  # 試合中のページ (速報) の構造を確認するため、試合の時間帯に保存する (日本時間 14:50 / 19:20)
  # 試合中の試合がなければ何も保存しない。不要になったらこの schedule を消してください。
  schedule:
    - cron: '50 5 * * *'
    - cron: '20 10 * * *'
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node dev/capture.mjs ${{ github.event_name == 'schedule' && '--live' || '' }}
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/fixtures/real
          git diff --cached --quiet && echo "no changes" || git commit -m "実ページを保存 (パーサー調整用) [skip ci]"
          git push || true
