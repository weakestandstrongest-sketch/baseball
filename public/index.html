<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>野球速報</title>
  <meta name="description" content="プロ野球 (セ・パ) と MLB の試合速報">
  <meta name="theme-color" content="#efe9df">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="野球速報">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,700;1,6..96,400;1,6..96,500&family=Shippori+Mincho:wght@400;500;700&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
  <!-- ひび手帳の中で開いたとき：シートはもうステータスバーの下にあるので、上の切り欠きぶんの空白をあけない -->
  <script>if (window.parent !== window) document.documentElement.classList.add('in-frame');</script>
<script>
// ひび手帳のモノクロモードの中で開いたとき：白黒に（?hibitheme=mono-dark / mono-light、あとから変わったときはメッセージで）
(function () {
  function apply(t) {
    var h = document.documentElement; h.classList.toggle('mono-d', t === 'mono-dark'); h.classList.toggle('mono-l', t === 'mono-light');
    var m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = t === 'mono-light' ? '#ffffff' : t === 'mono-dark' ? '#000000' : '#efe9df';
  }
  try { var q = new URLSearchParams(location.search).get('hibitheme'); if (q) { apply(q); sessionStorage.setItem('hibitheme', q); } else apply(sessionStorage.getItem('hibitheme') || ''); } catch (e) {}
  if (window.parent !== window) addEventListener('message', function (e) { if (e.source === parent && e.data && e.data.type === 'hibi:theme') apply(e.data.theme || ''); });
})();
</script>
</head>
<body>
  <div id="app"></div>
  <nav class="tabbar" id="tabbar"></nav>
  <script type="module" src="js/app.js"></script>
<!-- ひび手帳（iPhone アプリ版）の中で開いたとき：下のバーを iPhone 本物の部品（Liquid Glass）にしてもらう。ここのバーは見えなくするだけ（場所はそのまま） -->
<style>html.hibi-nbar #tabbar{opacity:0!important}</style>
<script>
(function () {
  if (window.parent === window) return;
  var on = false, last = '', raf = 0, C = { bar: '#tabbar', items: '#tabbar a', label: 'span', key: function (el) { return el.dataset.nav; }, active: function (el) { return el.classList.contains('on'); }, sym: { games: 'baseball', calendar: 'calendar', standings: 'trophy', stats: 'chart.bar', settings: 'gearshape' } };
  var items = function () { return Array.prototype.slice.call(document.querySelectorAll(C.items)); };
  var keyOf = function (el, i) { return C.key ? C.key(el, i) : 'i' + i; };
  function state() {
    var list = items(), bar = document.querySelector(C.bar), hidden = !bar || !list.length || !bar.getClientRects().length;
    if (!hidden) {
      // something (an article, a sheet) is over our bar: then the iPhone's bar should go away too
      var probe = list.filter(C.active)[0] || list[0], r = probe.getBoundingClientRect();
      var hit = document.elementFromPoint(r.left + r.width / 2, r.top + r.height / 2);
      hidden = !hit || !bar.contains(hit) || r.top > innerHeight;
    }
    var sel = '';
    var tabs = list.map(function (el, i) { var k = keyOf(el, i); if (C.active(el)) sel = k; var t = el.querySelector(C.label); return { key: k, title: (t ? t.textContent : el.textContent).trim(), symbol: C.sym[k] || 'circle' }; });
    var fab = C.fab && document.querySelector(C.fab);
    return { type: 'hibi:bar', tabs: tabs, selected: sel, fab: fab && fab.getClientRects().length ? C.fabSym : '', fabLabel: fab ? (fab.getAttribute('aria-label') || '') : '', hidden: hidden };
  }
  function send() { raf = 0; if (!on) return; var s = state(), j = JSON.stringify(s); if (j !== last) { last = j; parent.postMessage(s, '*'); } }
  function soon() { if (on && !raf) raf = requestAnimationFrame(send); }
  var mo = new MutationObserver(soon);
  addEventListener('message', function (e) {
    var d = e.data; if (e.source !== parent || !d) return;
    if (d.type === 'hibi:nbar') {
      on = !!d.on; last = '';
      document.documentElement.classList.toggle('hibi-nbar', on);
      mo.disconnect();
      if (on) { mo.observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ['class', 'aria-hidden', 'hidden', 'style', 'aria-current'] }); soon(); }
    } else if (d.type === 'hibi:tap' && on) {
      var el = d.fab ? document.querySelector(C.fab) : items().filter(function (x, i) { return keyOf(x, i) === d.key; })[0];
      if (el) el.click();
      soon();
    }
  });
  addEventListener('hashchange', soon);
  setInterval(soon, 500);
  parent.postMessage({ type: 'hibi:bar-hello' }, '*');
})();
</script>
</body>
</html>
